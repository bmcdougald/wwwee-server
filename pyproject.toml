[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".quality",
  ".tools",
  ".venv",
  "node_modules",
  "__pycache__",
  "build",
  "dist"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "S"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv", ".quality", ".tools", "node_modules", "build", "dist"]

