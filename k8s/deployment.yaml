apiVersion: apps/v1
kind: Deployment
metadata:
  name: wwwee-server
  labels:
    app.kubernetes.io/name: wwwee-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wwwee-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wwwee-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wwwee-server
          image: wwwee-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: WWWEE_ADDR
              value: ":8443"
            - name: WWWEE_CONTENT_DIR
              value: /srv/content
            - name: WWWEE_TLS_CERT_FILE
              value: /run/tls/tls.crt
            - name: WWWEE_TLS_KEY_FILE
              value: /run/tls/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /srv/content
              readOnly: true
            - name: tls
              mountPath: /run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Swap for a PersistentVolumeClaim if the site content is larger
        # than fits comfortably in a ConfigMap.
        - name: content
          configMap:
            name: wwwee-server-content
        - name: tls
          secret:
            secretName: wwwee-server-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
