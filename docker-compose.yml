services:
  wwwee-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wwwee-server:local
    ports:
      - "8080:8080"
    # --- Hardened runtime settings (Container Platform SRG / CIS Docker Benchmark) ---
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1700,uid=65532,gid=65532
    user: "65532:65532"
    volumes:
      # Site content is managed outside the container and published by the
      # deployment/content pipeline. The server only reads it.
      #
      # Local default: ./.runtime/content (easy to populate from the repo).
      # Production: set WWWEE_CONTENT_PATH to the platform's persistent
      # filesystem location, e.g. /srv/wwwee/content on Linux.
      - type: bind
        source: ${WWWEE_CONTENT_PATH:-./.runtime/content}
        target: /srv/content
        read_only: true
    environment:
      WWWEE_ADDR: ":8080"
      WWWEE_CONTENT_DIR: "/srv/content"
      # WWWEE_TLS_CERT_FILE: "/run/tls/tls.crt"
      # WWWEE_TLS_KEY_FILE: "/run/tls/tls.key"
    healthcheck:
      test: ["CMD", "/wwwee-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
