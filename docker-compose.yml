services:
  wwwee-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wwwee-server:local
    ports:
      - "8080:8080"
    # --- Hardened runtime settings (Container Platform SRG / CIS Docker Benchmark) ---
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1700,uid=65532,gid=65532
    user: "65532:65532"
    volumes:
      # Site content is managed outside the container and published by the
      # deployment/content pipeline. The server only reads it.
      - type: bind
        source: ${WWWEE_CONTENT_PATH:?WWWEE_CONTENT_PATH must point to the persistent site-content directory}
        target: /srv/content
        read_only: true
      # Optional direct TLS certificate and private-key mount.
      # - type: bind
      #   source: ./certs
      #   target: /run/tls
      #   read_only: true
    environment:
      WWWEE_ADDR: ":8080"
      WWWEE_CONTENT_DIR: "/srv/content"
      # WWWEE_TLS_CERT_FILE: "/run/tls/tls.crt"
      # WWWEE_TLS_KEY_FILE: "/run/tls/tls.key"
    healthcheck:
      test: ["CMD", "/wwwee-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
